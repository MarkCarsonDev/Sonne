{% extends "base.html" %}

{% block content %}
<div class="container container-narrow">
    <article class="page">
        <header class="page-header">
            <h1>{{ page.title }}</h1>
            
            {% if page.subtitle %}
            <p class="page-subtitle">{{ page.subtitle }}</p>
            {% endif %}
        </header>
        
        <div class="page-content">
            {{ content }}
        </div>
        
        {% if page.cta %}
        <div class="page-cta">
            <h2>{{ page.cta.title }}</h2>
            <p>{{ page.cta.description }}</p>
            <a href="{{ page.cta.url }}" class="btn btn-primary">{{ page.cta.text }}</a>
        </div>
        {% endif %}
    </article>
</div>
{% endblock %}
