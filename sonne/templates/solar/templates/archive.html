{% extends "base.html" %}

{% block content %}
<div class="archive-page">
    <header class="page-header">
        <h1>{{ page.title }}</h1>
    </header>

    <div class="posts-grid">
        {% for post in page.posts %}
        {% include "partials/post_card.html" %}
        {% endfor %}
    </div>

    <div class="archive-nav">
        <a href="/blog/" class="btn">Back to Blog</a>
    </div>
</div>
{% endblock %}
