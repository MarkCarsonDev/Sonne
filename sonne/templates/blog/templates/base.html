<!DOCTYPE html>
<html lang="{{ site.language }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }} - {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default(site.description) }}">
    <link rel="stylesheet" href="/css/style.css">
    {% if dithering_enabled %}<link rel="stylesheet" href="/css/dithering.css">{% endif %}
    <link rel="alternate" type="application/rss+xml" title="{{ site.title }} Feed" href="/feed.xml">
</head>
<body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header>
        <div class="container">
            <p class="site-title"><a href="/">{{ site.title }}</a></p>
            <nav aria-label="Main">
                <ul>
                    {% for item in site.nav %}
                    <li><a href="{{ item.url }}"{% if page.url == item.url %} class="active" aria-current="page"{% endif %}>{{ item.text }}</a></li>
                    {% endfor %}
                </ul>
            </nav>
        </div>
    </header>

    <main id="main" class="container" tabindex="-1">
        {% block content %}{% endblock %}
    </main>

    <footer>
        <div class="container">
            <div class="footer-content">
                <div class="copyright">
                    <p>&copy; {{ site.year }} {{ site.author }}</p>
                </div>
                <nav class="footer-links" aria-label="Footer">
                    <a href="/feed.xml">RSS</a>
                    <a href="{{ tag_url() }}">Tags</a>
                </nav>
            </div>
        </div>
    </footer>

    <script src="/js/main.js"></script>
    {% if dithering_enabled %}<script src="/js/dithering.js" defer></script>{% endif %}
</body>
</html>
