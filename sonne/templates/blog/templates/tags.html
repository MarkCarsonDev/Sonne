{% extends "base.html" %}

{% block content %}
<div class="tags-page">
    <header class="page-header">
        <h1>All Tags</h1>
    </header>
    
    {% if tags %}
    <div class="tag-cloud">
        {% for tag_name, tag_data in tags.items() %}
        <a href="/blog/tags/{{ tag_data.slug }}/" class="tag tag-{{ tag_data.posts|length }}">
            {{ tag_name }} ({{ tag_data.posts|length }})
        </a>
        {% endfor %}
    </div>
    {% else %}
    <p>No tags found.</p>
    {% endif %}
    
    <p class="tag-nav"><a href="/blog/">Back to Blog</a></p>
</div>
{% endblock %}
