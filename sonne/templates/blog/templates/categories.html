{% extends "base.html" %}

{% block content %}
<div class="categories-page">
    <header class="page-header">
        <h1>All Categories</h1>
    </header>

    {% if categories %}
    <div class="tag-cloud">
        {% for category_name, category_data in categories.items() %}
        <a href="/blog/categories/{{ category_data.slug }}/" class="tag">
            {{ category_name }} ({{ category_data.posts|length }})
        </a>
        {% endfor %}
    </div>
    {% else %}
    <p>No categories found.</p>
    {% endif %}

    <p class="tag-nav"><a href="/blog/">Back to Blog</a></p>
</div>
{% endblock %}
