<!DOCTYPE html>
<html lang="{{ site.language }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }} - {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default(site.description) }}">
    <link rel="stylesheet" href="/css/style.css">
    {% if dithering_enabled %}<link rel="stylesheet" href="/css/dithering.css">{% endif %}
</head>
<body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header>
        <div class="container">
            <p class="site-title"><a href="/">{{ site.title }}</a></p>
            <nav aria-label="Main">
                <ul>
                    <li><a href="/"{% if page.url == "/" %} aria-current="page"{% endif %}>Home</a></li>
                    <li><a href="/about/"{% if page.url in ["/about", "/about/", "/about.html"] %} aria-current="page"{% endif %}>About</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main id="main" class="container" tabindex="-1">
        {% block content %}{% endblock %}
    </main>

    <footer>
        <div class="container">
            <p>&copy; {{ site.year }} {{ site.author }}</p>
        </div>
    </footer>

    <script src="/js/main.js"></script>
    {% if dithering_enabled %}<script src="/js/dithering.js" defer></script>{% endif %}
</body>
</html>
