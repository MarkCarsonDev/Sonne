name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e ".[dev]"  # same pinned ruff as local
      - run: ruff check .
      - run: ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Installs the runtime deps too, so pyright resolves real imports;
      # it checks against Python 3.9 per [tool.pyright] in pyproject.toml.
      - run: pip install -e ".[dev]"
      - run: pyright

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.9'
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.13'
          - os: windows-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # The preinstalled Chrome does not start headless on Linux runners;
      # the dithering.js browser tests use Chrome's headless build instead.
      - if: runner.os == 'Linux'
        run: |
          npx -y @puppeteer/browsers install chrome-headless-shell@154.0.8037.92 --path "$RUNNER_TEMP/browsers"
          dirname "$(find "$RUNNER_TEMP/browsers" -type f -name chrome-headless-shell)" >> "$GITHUB_PATH"
      - run: pip install -e ".[dev]"
      - run: pytest -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      # Install the wheel in a clean env and smoke-test that packaged data
      # (bundled templates incl. sonne.yaml/scripts/data) actually ships.
      - run: |
          pip install dist/*.whl
          sonne new -p /tmp/smoke -t blog
          test -f /tmp/smoke/sonne.yaml
          cd /tmp/smoke && sonne build --no-progress
          test -f /tmp/smoke/output/index.html
